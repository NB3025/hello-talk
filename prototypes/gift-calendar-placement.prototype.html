<!DOCTYPE html>
<!--
  PROTOTYPE / 버릴 코드 — hello-talk
  질문: "카카오톡 셸(하단 탭 5개 고정, 캘린더 탭 없음)에 선물하기와 캘린더는 어디에 사는가?"
  변형 3개를 ?variant=A|B|C 로 전환. 셸(채팅 목록·대화방·친구 목록)은 사용자가 준
  스크린샷 3장을 그대로 따라 만들었고, 변형은 그 셸에 '붙는 방식'만 다르다.
  판정이 끝나면 이긴 변형만 실제 코드로 다시 쓰고 이 파일은 버린다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>선물하기·캘린더는 어디에 사는가 — UI 프로토타입</title>
<style>
  :root{
    --kakao:#FEE500; --kakao-ink:#3C1E1E;
    --room-bg:#B2C7D9; --unread:#FF3B30;
    --ink:#111113; --sub:#8A8A8E; --line:#EFEFF2; --chip:#F1F1F3;
    --page:#EDEEF0;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--page); color:var(--ink); padding:32px 20px 120px;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .stage{display:flex; gap:32px; align-items:flex-start; justify-content:center; flex-wrap:wrap}

  /* ── 폰 프레임 (평가 대상 아님, 그냥 액자) ── */
  .phone{
    width:390px; height:800px; flex:0 0 390px; background:#fff; border-radius:38px;
    box-shadow:0 22px 60px rgba(0,0,0,.18); overflow:hidden; position:relative;
    display:flex; flex-direction:column;
  }
  .notch{height:26px; flex:0 0 26px; background:#fff}
  .screen{flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; position:relative}
  .screen::-webkit-scrollbar{width:0}

  /* ── 앱 상단바 ── */
  .top{display:flex; align-items:center; gap:12px; padding:10px 16px 6px}
  .top h1{font-size:21px; font-weight:800; margin:0; letter-spacing:-.03em; flex:1}
  .top .icons{display:flex; gap:16px; color:#232326; font-size:17px}
  .top .back{font-size:19px; color:#232326}
  .top .roomname{font-size:17px; font-weight:700; flex:1; text-align:left; letter-spacing:-.02em}
  .me{display:flex; align-items:center; gap:9px; flex:1}
  .me .nm{font-size:17px; font-weight:700; letter-spacing:-.02em}

  /* ── 칩 / 세그먼트 ── */
  .chips{display:flex; gap:6px; padding:6px 16px 12px; overflow-x:auto}
  .chips::-webkit-scrollbar{height:0}
  .chip{
    flex:0 0 auto; font-size:13px; padding:6px 13px; border-radius:999px;
    background:var(--chip); color:#4A4A4F; display:flex; align-items:center; gap:5px; cursor:pointer;
  }
  .chip .n{color:#FF6B00; font-weight:700; font-size:12px}
  .chip[aria-pressed="true"]{background:#111113; color:#fff}
  .chip[aria-pressed="true"] .n{color:#FFD84D}
  .seg{display:flex; gap:18px; padding:2px 16px 10px}
  .seg span{font-size:15px; color:#B6B6BB; font-weight:700; cursor:pointer; padding-bottom:2px}
  .seg span[aria-pressed="true"]{color:#111113; border-bottom:2px solid #111113}

  /* ── 배너 ── */
  .banner{
    margin:0 14px 8px; background:#F6F6F8; border-radius:14px; padding:12px 14px;
    display:flex; align-items:center; gap:10px;
  }
  .banner .t{flex:1; min-width:0}
  .banner .t b{display:block; font-size:13.5px; letter-spacing:-.02em}
  .banner .t span{font-size:12px; color:var(--sub)}
  .banner .ems{display:flex; gap:-4px}
  .em{
    width:26px; height:26px; border-radius:8px; display:grid; place-items:center;
    font-size:13px; margin-left:-6px; box-shadow:0 0 0 2px #fff;
  }

  /* ── 리스트 행 ── */
  .row{display:flex; gap:12px; padding:9px 16px; align-items:center; cursor:pointer}
  .row:active{background:#FAFAFB}
  .av{
    width:44px; height:44px; border-radius:16px; flex:0 0 44px; display:grid; place-items:center;
    font-size:15px; color:#fff; font-weight:700; overflow:hidden; position:relative;
  }
  .av.sm{width:34px; height:34px; border-radius:12px; flex-basis:34px; font-size:12px}
  .av.grid{display:grid; grid-template-columns:1fr 1fr; gap:1px; background:#fff}
  .av.grid i{display:block; font-style:normal}
  .row .body{flex:1; min-width:0}
  .row .nm{font-size:15px; letter-spacing:-.02em; display:flex; align-items:center; gap:5px}
  .row .nm em{font-style:normal; color:#A8A8AD; font-size:13px; font-weight:400}
  .row .msg{font-size:13px; color:var(--sub); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:1px}
  .row .meta{text-align:right; flex:0 0 auto; display:flex; flex-direction:column; align-items:flex-end; gap:4px}
  .row .tm{font-size:11px; color:#B0B0B5}
  .badge{
    background:var(--unread); color:#fff; font-size:11px; font-weight:700; min-width:18px; height:18px;
    border-radius:999px; padding:0 5px; display:grid; place-items:center;
  }
  .pillbtn{
    background:var(--chip); color:#2A2A2E; font-size:12.5px; padding:6px 12px;
    border-radius:999px; border:0; cursor:pointer; font-family:inherit;
  }
  .pillbtn.solid{background:var(--kakao); color:var(--kakao-ink); font-weight:700}
  .sec{padding:14px 16px 6px; font-size:12.5px; color:var(--sub); display:flex; align-items:center; gap:6px}
  .sec b{color:#2A2A2E; font-weight:600; font-size:13px}
  .sec .more{margin-left:auto; color:#B0B0B5; font-size:12px}
  .hr{height:1px; background:var(--line); margin:8px 16px}
  .strip{display:flex; gap:14px; padding:4px 16px 10px; overflow-x:auto}
  .strip::-webkit-scrollbar{height:0}
  .strip .one{flex:0 0 auto; width:52px; text-align:center}
  .strip .one .av{width:52px; height:52px; border-radius:50%; flex-basis:52px; margin-bottom:5px}
  .strip .one span{font-size:11px; color:#5A5A5F; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .dot{position:absolute; top:0; right:0; width:9px; height:9px; border-radius:50%; background:var(--unread); box-shadow:0 0 0 2px #fff}

  /* ── 대화방 ── */
  .room{background:var(--room-bg); min-height:100%; padding:14px 12px 8px}
  .msgrow{display:flex; gap:8px; margin-bottom:10px; align-items:flex-end}
  .msgrow.mine{justify-content:flex-end}
  .msgrow .who{font-size:12px; color:#33383D; margin-bottom:4px}
  .bub{
    max-width:214px; padding:8px 11px; border-radius:14px; font-size:14px; line-height:1.45;
    background:#fff; letter-spacing:-.01em;
  }
  .mine .bub{background:var(--kakao)}
  .stamp{font-size:10px; color:#4A5560; display:flex; flex-direction:column; align-items:flex-end; gap:1px}
  .stamp .rd{color:#5C6873}
  .composer{
    display:flex; align-items:center; gap:10px; padding:9px 14px 16px; background:#fff;
    border-top:1px solid #E4E4E8; flex:0 0 auto;
  }
  .composer .ph{
    flex:1; background:#F4F4F6; border-radius:999px; padding:8px 12px;
    color:#AFAFB4; font-size:14px;
  }
  .composer .ic{color:#8A8A8E; font-size:16px}
  .roombanner{
    background:rgba(255,255,255,.92); border-radius:14px; padding:11px 13px; margin-bottom:12px;
    display:flex; align-items:center; gap:10px;
  }
  .roombanner .ic{
    width:34px; height:34px; border-radius:11px; background:var(--kakao); display:grid;
    place-items:center; font-size:15px; flex:0 0 34px;
  }
  .roombanner .t{flex:1; min-width:0}
  .roombanner .t b{display:block; font-size:13px}
  .roombanner .t span{font-size:11.5px; color:var(--sub)}

  /* ── 하단 탭바 ── */
  .tabbar{
    display:flex; border-top:1px solid #E7E7EB; background:#fff; flex:0 0 auto;
    padding:7px 2px 12px;
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:2px; cursor:pointer;
    color:#C2C2C7; font-size:9.5px; position:relative;
  }
  .tab .g{font-size:19px; line-height:1}
  .tab[aria-current="true"]{color:#111113}
  .tab .tb{
    position:absolute; top:-3px; right:calc(50% - 20px); background:var(--unread); color:#fff;
    font-size:9.5px; font-weight:700; min-width:16px; height:16px; border-radius:999px;
    padding:0 4px; display:grid; place-items:center;
  }

  /* ── 커머스(A) ── */
  .cgrid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px 6px; padding:12px 14px 6px}
  .cgrid .c{text-align:center; cursor:pointer}
  .cgrid .c .ic{
    width:50px; height:50px; border-radius:16px; margin:0 auto 5px; display:grid; place-items:center;
    font-size:21px; background:#F5F5F7;
  }
  .cgrid .c span{font-size:11px; color:#3A3A3F}
  .prods{display:grid; grid-template-columns:1fr 1fr; gap:14px; padding:8px 14px 16px}
  .prod .th{
    aspect-ratio:1; border-radius:14px; margin-bottom:7px; display:grid; place-items:center;
    font-size:34px;
  }
  .prod .bn{font-size:11.5px; color:var(--sub)}
  .prod .pn{font-size:13.5px; letter-spacing:-.02em; margin:1px 0 3px}
  .prod .pr{font-size:13.5px; font-weight:800}
  .rank{padding:0 16px 8px}
  .rank .r{display:flex; gap:12px; align-items:center; padding:7px 0}
  .rank .r .no{font-size:14px; font-weight:800; width:14px; color:#111}
  .rank .r .th{width:42px; height:42px; border-radius:12px; display:grid; place-items:center; font-size:19px}
  .rank .r .body{flex:1; min-width:0}

  /* ── 캘린더 ── */
  .cal{padding:6px 12px 16px}
  .calhead{display:flex; align-items:center; gap:10px; padding:4px 4px 12px}
  .calhead b{font-size:19px; letter-spacing:-.03em}
  .calhead .nav{margin-left:auto; display:flex; gap:14px; color:#8A8A8E; font-size:15px}
  .dow{display:grid; grid-template-columns:repeat(7,1fr); font-size:11px; color:#A8A8AD; text-align:center; padding-bottom:4px}
  .dow .sun{color:#E5544B}
  .days{display:grid; grid-template-columns:repeat(7,1fr); gap:1px 0}
  .day{min-height:52px; padding:4px 3px 0; cursor:pointer; border-top:1px solid #F4F4F6}
  .day .n{font-size:12px; color:#4A4A4F; text-align:center; display:block; margin-bottom:3px}
  .day.sun .n{color:#E5544B}
  .day.out .n{color:#D6D6DA}
  .day.today .n{
    background:#111113; color:#fff; width:20px; height:20px; border-radius:50%;
    margin:0 auto 3px; display:grid; place-items:center; font-size:11px;
  }
  .ev{
    font-size:9.5px; border-radius:4px; padding:1px 3px; margin-bottom:2px; overflow:hidden;
    white-space:nowrap; text-overflow:ellipsis; line-height:1.5;
  }
  .ev.y{background:#FFF3A8; color:#5A4A00}
  .ev.b{background:#DCE9F7; color:#2B4A6B}
  .ev.p{background:#F7DCE9; color:#6B2B4A}
  .agenda{padding:10px 16px 20px}
  .agenda .a{display:flex; gap:12px; padding:9px 0; border-bottom:1px solid var(--line)}
  .agenda .a .tm{font-size:12px; color:var(--sub); flex:0 0 52px}
  .agenda .a .body{flex:1; min-width:0}
  .agenda .a .nm{font-size:14px; letter-spacing:-.02em}
  .agenda .a .sub{font-size:12px; color:var(--sub); margin-top:1px}

  /* ── 피드(C) ── */
  .feed{padding:8px 14px 20px}
  .fcard{
    border:1px solid var(--line); border-radius:16px; padding:13px 14px; margin-bottom:10px;
    display:flex; gap:11px; align-items:flex-start;
  }
  .fcard.warn{border-color:#F3D98A; background:#FFFCF0}
  .fcard .ic{
    width:36px; height:36px; border-radius:12px; flex:0 0 36px; display:grid; place-items:center;
    font-size:16px; background:#F5F5F7;
  }
  .fcard .body{flex:1; min-width:0}
  .fcard .k{font-size:11px; color:var(--sub); margin-bottom:2px}
  .fcard .nm{font-size:14.5px; letter-spacing:-.02em; line-height:1.4}
  .fcard .sub{font-size:12.5px; color:var(--sub); margin-top:2px}
  .fcard .acts{display:flex; gap:6px; margin-top:9px}
  .daymark{font-size:12px; color:#8A8A8E; padding:12px 2px 6px; font-weight:600}
  .toggle{display:flex; gap:4px; padding:8px 14px 2px}
  .toggle button{
    font:inherit; font-size:12.5px; padding:6px 12px; border-radius:999px; border:0;
    background:var(--chip); color:#4A4A4F; cursor:pointer;
  }
  .toggle button[aria-pressed="true"]{background:#111113; color:#fff}

  /* ── 시트(B) ── */
  .sheetwrap{position:absolute; inset:0; display:flex; align-items:flex-end; z-index:5}
  .scrim{position:absolute; inset:0; background:rgba(0,0,0,.42)}
  .sheet{
    position:relative; width:100%; background:#fff; border-radius:20px 20px 0 0;
    padding:8px 0 18px; max-height:80%; overflow-y:auto; box-shadow:0 -8px 30px rgba(0,0,0,.16);
  }
  .sheet .grab{width:38px; height:4px; border-radius:999px; background:#DDDDE2; margin:4px auto 12px}
  .sheet h3{font-size:16px; margin:0 0 2px; padding:0 18px; letter-spacing:-.02em}
  .sheet .lead{font-size:12.5px; color:var(--sub); padding:0 18px 12px; margin:0}
  .sheet .close{
    position:absolute; top:12px; right:14px; border:0; background:transparent; font-size:17px;
    color:#A8A8AD; cursor:pointer;
  }

  /* ── 판정용 노트 (설계 대상 아님, 명확히 분리) ── */
  .notes{flex:0 1 340px; min-width:280px}
  .notes .lab{
    display:inline-block; background:#111113; color:#fff; font-size:11px; font-weight:700;
    padding:3px 9px; border-radius:999px; letter-spacing:.03em; margin-bottom:12px;
  }
  .notes h2{font-size:20px; margin:0 0 4px; letter-spacing:-.025em}
  .notes .one{font-size:13.5px; color:#5A5A5F; margin:0 0 18px}
  .notes dl{margin:0}
  .notes dt{font-size:11.5px; color:var(--sub); margin-top:14px}
  .notes dd{margin:2px 0 0; font-size:13.5px; line-height:1.6}
  .notes .q{
    margin-top:22px; padding:12px 14px; background:#fff; border-radius:12px;
    font-size:13px; line-height:1.6; border:1px solid #E2E2E7;
  }
  .notes .q b{display:block; margin-bottom:4px; font-size:12px; color:var(--sub); font-weight:600}
  .screens{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px}
  .screens button{
    font:inherit; font-size:12px; padding:5px 11px; border-radius:8px; border:1px solid #DCDCE1;
    background:#fff; cursor:pointer; color:#4A4A4F;
  }
  .screens button[aria-pressed="true"]{background:#111113; border-color:#111113; color:#fff}

  /* ── 변형 전환 바 (프로토타입 장치임이 드러나야 함) ── */
  .switcher{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:50;
    display:flex; align-items:center; gap:4px; background:#111113; color:#fff;
    border-radius:999px; padding:6px 8px; box-shadow:0 10px 30px rgba(0,0,0,.34);
  }
  .switcher button{
    font:inherit; background:transparent; border:0; color:#fff; cursor:pointer; font-size:16px;
    width:32px; height:32px; border-radius:50%; display:grid; place-items:center;
  }
  .switcher button:hover{background:#2C2C31}
  .switcher .cur{font-size:13px; padding:0 10px; white-space:nowrap}
  .switcher .cur b{font-weight:700; margin-right:6px}
  .switcher .kbd{font-size:11px; color:#8A8A8E; padding-right:6px}
</style>
</head>
<body>

<div class="stage">
  <div class="phone">
    <div class="notch"></div>
    <div class="screen" id="screen"></div>
    <div class="tabbar" id="tabbar"></div>
  </div>
  <div class="notes" id="notes"></div>
</div>

<div class="switcher" role="group" aria-label="변형 전환">
  <button id="prev" aria-label="이전 변형">←</button>
  <span class="cur" id="cur"></span>
  <button id="next" aria-label="다음 변형">→</button>
  <span class="kbd">← →</span>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   스크린샷에서 가져온 데이터. 밀도를 진짜처럼 만들려고 그대로 옮겼다.
   ══════════════════════════════════════════════════════════════ */
const C = ['#F6C1B4','#C7D8EA','#D9CBEF','#FBDFA4','#BFE3C9','#F0C7D9','#CFCFD6','#EAD9C0'];
const hue = s => C[[...s].reduce((a,c)=>a+c.charCodeAt(0),0) % C.length];

const CHATS = [
  {n:'혜선, 유진, 나연', cnt:4, m:'그래서 우리 내일 만나', t:'오후 3:30', u:3, g:['혜','유','나','+']},
  {n:'김철수 ☕',        m:'선물 고마워! 잘 마실게',      t:'오후 3:00', u:1},
  {n:'러닝 함께해요', cnt:34, m:'한강 러닝 멤버분들과 함께해요~', t:'오후 2:00', u:10, g:['러','닝','함','께']},
  {n:'고양이 집사들', cnt:4,  m:'이 사진 진짜 귀엽네요!',    t:'오후 1:30', u:3, g:['고','양','이','집']},
  {n:'영어 선생님',            m:'선생님 수요일에 괜찮으세요?', t:'오후 1:00', u:2},
  {n:'월간 독서 모임', cnt:12, m:'저도 좋아요 그 작가님 책 궁금했어요', t:'오후 12:30', u:2, g:['월','간','독','서']},
  {n:'동기방', cnt:4,          m:'다들 이번 주말에 시간 돼?',  t:'오후 12:30', g:['동','기','방','+']},
];

const MSGS = [
  {who:'홍길동', text:'우리 언제 만나?', t:'오후 6:00'},
  {mine:true, text:'23일 저녁 어때?'},
  {mine:true, text:'판교역 4번 출구에서 만나', t:'오후 6:00', read:'수신됨'},
];

const UPDATED = ['김영수','이철수','카카오','박민수','박영수'];
const BIRTHDAY = {n:'이영희', when:'오늘', emoji:'🎂'};

const PRODUCTS = [
  {b:'스타벅스',   n:'아이스 카페 아메리카노 T', p:4500,  e:'☕'},
  {b:'배스킨라빈스', n:'파인트 아이스크림',      p:9800,  e:'🍨'},
  {b:'뚜레쥬르',   n:'생일 케이크 1호',        p:32000, e:'🎂'},
  {b:'BBQ',        n:'황금올리브 치킨',        p:20000, e:'🍗'},
];
const CATS = [
  ['🎂','생일'],['☕','커피'],['🍰','케이크'],['🍗','치킨'],
  ['💐','꽃'],['🧴','뷰티'],['🎫','상품권'],['🏨','호텔'],
];
const EVENTS = [
  {d:23, t:'오후 6:00', n:'길동이랑 저녁', where:'판교역 4번 출구', c:'y', who:'홍길동'},

/* 캘린더 월 뷰 — A와 C가 같은 조각을 다른 그릇에 담는다 */
function monthGrid() {
  const first = 1, offset = 2, total = 30; // 2026-09-01 은 화요일 → 앞에 일·월 2칸
  const cells = [];
  for (let i = 0; i < offset; i++) cells.push({ out:true, n: 31 - offset + i + 1 });
  for (let d = first; d <= total; d++) cells.push({ n:d, evs: EVENTS.filter(e => e.d === d) });
  while (cells.length % 7) cells.push({ out:true, n: cells.length % 7 });
  return `
    <div class="dow"><span class="sun">일</span><span>월</span><span>화</span><span>수</span>
      <span>목</span><span>금</span><span>토</span></div>
    <div class="days">
      ${cells.map((c,i) => `
        <div class="day ${c.out?'out':''} ${i%7===0?'sun':''} ${c.n===TODAY&&!c.out?'today':''}">
          <span class="n">${c.n}</span>
          ${(c.evs||[]).map(e => `<div class="ev ${e.c}">${e.n}</div>`).join('')}
        </div>`).join('')}
    </div>`;
}

    },
    shop:   () => `<div class="top"><h1>쇼핑</h1></div>
      <div style="padding:60px 20px;text-align:center;color:#B0B0B5;font-size:13px">프로토타입 범위 밖</div>`,
    more:   () => `<div class="top"><h1>더보기</h1></div>

  },
  sheets:{
    gift:() => `

const KEYS = Object.keys(VARIANTS);

/* ══════════════════ 라우팅 + 렌더 (전부 버릴 껍데기) ══════════════════ */
let url;
try { url = new URLSearchParams(location.search); } catch (_) { url = new URLSearchParams(''); }
let vkey  = KEYS.includes(url.get('variant')) ? url.get('variant') : 'A';
let scr   = url.get('screen') || 'chats';
let sub   = 'list';
let sheet = null;

const $ = id => document.getElementById(id);

// 아티팩트 뷰어처럼 샌드박스된 iframe 안에서는 replaceState 가 거부될 수 있다.
// URL 공유는 부가 기능이므로, 실패해도 변형 전환 자체는 계속 동작해야 한다.
function syncUrl() {
  try {
    history.replaceState(null, '', `?${new URLSearchParams({ variant: vkey, screen: scr })}`);
  } catch (_) { /* iframe 안에서는 무시 */ }
}

function setVariant(k) {
  vkey = k; sheet = null; sub = 'list';
  if (!VARIANTS[k].screens[scr]) scr = 'chats';
  syncUrl();
  render();
}
function go(s) {
  scr = s; sheet = null;
  syncUrl();
  render();
}

function render() {
  const V = VARIANTS[vkey];

  $('screen').innerHTML = (V.screens[scr] || V.screens.chats)(sub)
    + (sheet && V.sheets && V.sheets[sheet] ? `
      <div class="sheetwrap">
        <div class="scrim" data-close="1"></div>
        <div class="sheet"><div class="grab"></div>
          <button class="close" data-close="1">✕</button>
          ${V.sheets[sheet]()}</div>
      </div>` : '');

  // 실제 카카오톡은 대화방에서 탭바가 사라지고 입력창이 그 자리를 차지한다.
  // 이걸 안 지키면 "진입점이 탭에 있는가"라는 판정 자체가 왜곡된다.
  if (scr === 'room') {
    $('tabbar').outerHTML = `<div class="composer" id="tabbar">
      <span class="ic">＋</span>
      <span class="ph">메시지 입력</span>
      <span class="ic">☺</span><span class="ic">#</span>
    </div>`;
  } else {
    const bar = $('tabbar');
    bar.className = 'tabbar';
    bar.innerHTML = V.tabs.map(([id, g, label, badge]) => `
      <div class="tab" data-go="${id}" aria-current="${id === scr}">
        <span class="g">${g}</span>${badge ? `<span class="tb">${badge}</span>` : ''}
        <span>${label}</span>
      </div>`).join('');
  }

  $('notes').innerHTML = `
    <span class="lab">PROTOTYPE · 변형 ${vkey}</span>
    <h2>${V.name}</h2>
    <p class="one">${V.one}</p>
    <dl>
      <dt>정보 계층</dt><dd>${V.hierarchy}</dd>
      <dt>이 구조가 얻는 것</dt><dd>${V.pros}</dd>
      <dt>이 구조가 잃는 것</dt><dd>${V.cons}</dd>
    </dl>
    <div class="q"><b>이 변형을 고르려면 먼저 답해야 하는 것</b>${V.q}</div>
    <div class="screens">
      ${Object.keys(V.screens).map(s =>
        `<button data-go="${s}" aria-pressed="${s === scr}">${s}</button>`).join('')}
      ${V.screens.room ? `<button data-go="room" aria-pressed="${scr==='room'}">room</button>` : ''}
    </div>`;

  $('cur').innerHTML = `<b>${vkey}</b>${V.name}`;

  document.querySelectorAll('[data-go]').forEach(el =>
    el.onclick = e => { e.stopPropagation(); go(el.dataset.go); });
  document.querySelectorAll('[data-sheet]').forEach(el =>
    el.onclick = e => { e.stopPropagation(); sheet = el.dataset.sheet; render(); });
  document.querySelectorAll('[data-close]').forEach(el =>
    el.onclick = () => { sheet = null; render(); });
  document.querySelectorAll('[data-sub]').forEach(el =>
    el.onclick = () => { sub = el.dataset.sub; render(); });
}

const cycle = d => setVariant(KEYS[(KEYS.indexOf(vkey) + d + KEYS.length) % KEYS.length]);
$('prev').onclick = () => cycle(-1);
$('next').onclick = () => cycle(+1);
addEventListener('keydown', e => {
  const t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  if (e.key === 'ArrowLeft')  cycle(-1);
  if (e.key === 'ArrowRight') cycle(+1);
});

setVariant(vkey);
</script>
</body>
